<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Хвосты — уровни</title>
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="menu.css">
</head>
<body>
<div class="waves"></div>
<main id="pick">
  <header class="top">
    <a class="back" href="index.html">← Карты</a>
    <div class="grow"><h1 class="title" id="title"></h1><p class="sub" id="about"></p></div>
    <a class="pill" href="lobby.html">👫 С друзьями</a>
  </header>
  <div class="levels" id="levels"></div>
</main>
<script type="module">
import { mapById, progress } from './src/levels.js';
const m = mapById(new URLSearchParams(location.search).get('map'));
document.title = `Хвосты — ${m.name}`;
document.getElementById('title').textContent = `${m.emoji} ${m.name}`;
document.getElementById('about').textContent = m.about;
const open = progress.unlocked(m.id);
document.getElementById('levels').style.setProperty('--cols', m.levels.length > 6 ? 5 : m.levels.length);
document.getElementById('levels').innerHTML = m.levels.map((l) => {
  const ok = l.id <= open;
  const st = progress.stars(m.id, l.id);
  const stars = '⭐'.repeat(st) + '<span class="off">' + '★'.repeat(3 - st) + '</span>';
  const inner = `<span class="num">${ok ? l.id : '🔒'}</span><span class="name">${ok ? l.name : l.name}</span>
    <span class="about">${ok ? l.hint : 'откроется, когда пройдёшь предыдущий'}</span>
    <span class="meta">${stars} · волн ${l.target}</span>`;
  const bg = `style="--img:url('${m.preview}')"`;
  return ok ? `<a class="lvl" ${bg} href="play.html?map=${m.id}&level=${l.id}" data-level="${l.id}">${inner}</a>`
            : `<div class="lvl locked" ${bg}>${inner}</div>`;
}).join('');
</script>
</body>
</html>
