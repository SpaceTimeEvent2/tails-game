<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Хвосты — командная игра</title>
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="menu.css">
</head>
<body>
<div class="waves"></div>
<main id="pick">
  <header class="top">
    <a class="back" href="index.html">← Домой</a>
    <div class="grow"><h1 class="title">Командная игра</h1><p class="sub">До четырёх друзей: общий домик и общие волны. Подружек можно растить вместе.</p></div>
    <a class="pill me" id="me" href="profile.html?back=lobby"></a>
  </header>

  <section class="panel2 room" id="room-panel" hidden>
    <h2>Игра <span id="room-where"></span></h2>
    <div class="empty">Код для друзей</div>
    <div class="bigcode" id="room-code">····</div>
    <div class="who" id="room-players"></div>
    <div class="row">
      <button class="btn big" id="btn-start">▶ Играем!</button>
      <span id="room-wait" class="empty">Ждём, когда ведущий начнёт…</span>
      <button class="btn ghost" id="btn-leave">Выйти</button>
    </div>
  </section>

  <div class="lobby-grid" id="lobby-main">
    <section class="panel2">
      <h2>Открытые игры</h2>
      <div class="games" id="games"><div class="empty">Подключаемся…</div></div>
    </section>
    <div class="stack">
      <section class="panel2">
        <h2>Войти по коду</h2>
        <div class="row">
          <input type="text" class="code" id="join-code" maxlength="4" placeholder="КОД" autocomplete="off">
          <button class="btn big" id="btn-join" style="flex:1">Войти</button>
        </div>
      </section>
      <section class="panel2" style="justify-content:space-between">
        <h2>Создать игру</h2>
        <div class="row fill">
          <label class="field">Карта<select id="map"></select></label>
          <label class="field">Уровень<select id="level"></select></label>
        </div>
        <div class="row vis">
          <label><input type="radio" name="vis" value="pub" checked> Открытая</label>
          <label><input type="radio" name="vis" value="code"> Только по коду</label>
        </div>
        <button class="btn big" id="btn-create">✨ Создать</button>
      </section>
    </div>
  </div>
  <p class="err" id="err"></p>
</main>
<script type="module" src="src/lobby.js"></script>
</body>
</html>
