<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Хвосты — создать уровень</title>
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="play.css">
<link rel="stylesheet" href="editor.css">
<script type="importmap">
{ "imports": {
    "three": "./vendor/three/build/three.module.js",
    "three/addons/": "./vendor/three/examples/jsm/"
} }
</script>
</head>
<body class="runner-on">
<canvas id="scene"></canvas>

<div id="tools">
  <button data-tool="road" class="on" title="1">🛤<b>Дорога</b></button>
  <button data-tool="spot" title="2">⭕<b>Плита</b></button>
  <button data-tool="spawn" title="3">🚪<b>Старт</b></button>
  <button data-tool="house" title="4">🏠<b>Домик</b></button>
  <button data-tool="erase" title="5">🧽<b>Убрать</b></button>
  <button id="btn-undo" type="button" disabled>↩️<b>Назад</b></button>
</div>
<div id="rail">
  <button id="r-play" type="button">▶️<b>Играть</b></button>
  <button id="r-save" type="button">💾<b>Сохранить</b></button>
  <button id="r-more" type="button">⚙️<b>Ещё</b></button>
  <button id="r-fit" type="button">🔎<b>Всё поле</b></button>
  <a id="r-home" href="index.html">🏠<b>Домой</b></a>
</div>
<div id="st-mini"></div>
<div id="scrim"></div>

<aside id="side">
  <a class="back" href="index.html">← Домой</a>
  <button id="side-close" type="button">✕ К полю</button>
  <label class="field">Название<input type="text" id="name" maxlength="24"></label>
  <div class="row2">
    <label class="field">Волн<input type="number" id="target" min="3" max="25" value="8"></label>
    <label class="field">Сложность<select id="diff"></select></label>
  </div>
  <div class="row2">
    <label class="field">Вид поля<select id="theme"></select></label>
    <label class="field">👻 Привидения<select id="ghosts"></select></label>
  </div>
  <div class="field">Кого можно строить<div id="friends" class="pick"></div></div>
  <div id="foreign" hidden></div>
  <div id="status"></div>
  <div class="btns">
    <button class="btn" id="btn-save">💾 Сохранить</button>
    <button class="btn" id="btn-copy" hidden>📄 Копировать</button>
    <button class="btn" id="btn-play">▶ Играть</button>
    <button class="btn ghost" id="btn-team">👫 С друзьями</button>
    <button class="btn ghost" id="btn-export">📋 Код</button>
    <button class="btn ghost" id="btn-import">📥 Вставить</button>
    <button class="btn ghost" id="btn-new">🧹 Новый</button>
  </div>
  <textarea id="code" rows="3" placeholder="Код уровня" hidden></textarea>
  <h3>Мои уровни</h3>
  <div id="mine"></div>
</aside>

<div id="big-buttons">
  <button id="btn-put" class="huge" title="E / Enter">🔨 Поставить</button>
  <button id="btn-jump" class="huge ghost" title="Пробел">🤸 Прыжок</button>
</div>
<div id="spin"><button id="spin-left" type="button" aria-label="Повернуть сцену влево">⟲</button><button id="spin-right" type="button" aria-label="Повернуть сцену вправо">⟳</button></div>
<div id="joy"><i></i></div>
<div id="toast"></div>
<div id="loading"><div class="tail-spin">🛠</div><div id="load-text">Готовим поле…</div><div class="bar"><i id="load-bar"></i></div></div>

<script type="module" src="src/editor.js"></script>
</body>
</html>
